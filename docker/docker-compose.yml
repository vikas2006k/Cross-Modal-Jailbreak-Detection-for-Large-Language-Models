version: '3.8'

services:
  cmjd-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cmjd-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEVICE=cpu
      - API_PORT=8001
      - LOG_LEVEL=INFO
    volumes:
      - ../models:/app/models:ro
    networks:
      - cmjd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  cmjd-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: cmjd-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      cmjd-backend:
        condition: service_healthy
    networks:
      - cmjd-network

networks:
  cmjd-network:
    driver: bridge
